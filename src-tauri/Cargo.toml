[package]
name = "spacehog"
version = "1.0.1"
edition = "2021"
license = "MIT"
authors = ["Dexter Santucci"]
description = "See what takes space on your drives"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rayon = "1"
bincode = "1.3"
lz4_flex = "0.11"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_Foundation"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
